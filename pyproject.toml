[project]
name = "GeoPakTile"
version = "1.0.0"
description = "Create a Geopackage XYZ Tile layer."
readme = "README.md"
authors = [
    { name = "apwebber", email = "39490780+apwebber@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
dependencies = [
    "typing_extensions>=4.0; python_version < '3.11'",
    "morecantile>=6.2.0",
    "numpy>=2.2.6",
    "requests>=2.34.2",
]

[project.scripts]
geopaktile = "geopaktile:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "diskcache",
    "rasterio"
]
